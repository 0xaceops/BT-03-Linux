<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kho ảnh bách khoa — Nhóm 6 (Neon)</title>
<style>
:root {
  --bg: #f7f4ed;
  --ink: #2b2723;
  --line: #dcd3be;
  --line-dark: #b8ac94;
  --accent: #8c2d19;
  --accent-btn: #cb7427;
  --card-bg: #fffdf9;
  --frame-bg: #faf7f0;
  --green: #2e7d32;
  --green-bg: #e8f5e9;
  --green-border: #a5d6a7;
  --red: #c62828;
  --red-bg: #ffebee;
  --red-border: #ef9a9a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
  -webkit-font-smoothing: antialiased;
}
header {
  text-align: center;
  padding: 30px 16px 12px;
  border-bottom: 3px double var(--line);
}
h1 {
  margin: 0;
  font-size: 2.1rem;
  letter-spacing: .06em;
  font-variant: small-caps;
  color: #1a1714;
}
header p {
  margin: 6px 0 14px;
  font-style: italic;
  font-size: 0.95rem;
  opacity: .75;
}
form {
  display: flex;
  gap: 10px;
  justify-content: center;
  padding: 18px 12px;
  flex-wrap: wrap;
}
input {
  font: inherit;
  padding: 10px 14px;
  width: min(440px, 90vw);
  border: 1px solid var(--line-dark);
  background: #fff;
  color: var(--ink);
  border-radius: 4px;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.04);
}
input:focus {
  outline: 2px solid var(--accent);
}
button {
  font: inherit;
  font-weight: 500;
  padding: 10px 22px;
  border: 1px solid var(--accent-btn);
  background: var(--accent-btn);
  color: #fff;
  border-radius: 4px;
  cursor: pointer;
  transition: opacity .15s;
}
button:hover { opacity: .9; }
button.ghost {
  background: transparent;
  color: var(--accent);
  border-color: var(--accent);
}
main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 16px;
}
h2 {
  font-variant: small-caps;
  border-bottom: 1px solid var(--line);
  padding-bottom: 6px;
  margin-top: 24px;
  color: #221e1a;
  font-size: 1.35rem;
  letter-spacing: .04em;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
  gap: 20px;
  margin-top: 18px;
}
.card {
  margin: 0;
  display: flex;
  flex-direction: column;
}
.plate-frame {
  background: var(--frame-bg);
  border: 1px solid var(--line);
  box-shadow: 0 4px 10px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
  padding: 10px 10px 8px;
  border-radius: 2px;
  transition: transform .2s, box-shadow .2s;
}
.plate-frame:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 14px rgba(0,0,0,0.09);
}
.plate-mat {
  border: 1px solid var(--line-dark);
  padding: 3px;
  background: #fff;
}
.plate-mat img {
  width: 100%;
  height: auto;
  aspect-ratio: 1;
  object-fit: cover;
  display: block;
  background: #111;
}
.plate-caption {
  font-size: 0.78rem;
  text-align: center;
  padding: 7px 4px 2px;
  color: #4c443b;
  letter-spacing: .03em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-meta {
  margin-top: 8px;
  padding: 0 2px;
}
.file-name {
  font-style: italic;
  font-size: 0.82rem;
  color: #2a2520;
  word-break: break-all;
  margin-bottom: 4px;
}
.tags-row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.75rem;
  color: #726859;
}
.badge-ai {
  display: inline-block;
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: 1px 5px;
  font-size: 0.7rem;
  font-weight: bold;
  border-radius: 2px;
  letter-spacing: .02em;
}
.card.new .plate-frame {
  outline: 2px solid var(--accent);
  box-shadow: 0 0 14px rgba(140, 45, 25, 0.45);
}
#msg {
  text-align: center;
  padding: 36px 12px;
  font-style: italic;
  font-size: 1.1rem;
}
.spin {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid var(--accent);
  border-right-color: transparent;
  border-radius: 50%;
  animation: r 1s linear infinite;
  vertical-align: -2px;
  margin-right: 10px;
}
@keyframes r { to { transform: rotate(360deg); } }

/* Footer Stats Tables */
footer {
  max-width: 1200px;
  margin: 40px auto 30px;
  padding: 16px;
  border-top: 3px double var(--line);
}
.stats-table {
  border-collapse: collapse;
  width: 100%;
  margin: 14px 0 24px;
  background: var(--frame-bg);
  border: 1px solid var(--line);
  box-shadow: 0 2px 6px rgba(0,0,0,0.03);
}
.stats-table th {
  border: 1px solid var(--line);
  padding: 9px 12px;
  text-align: left;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: #5d5345;
  background: #f1ebd8;
}
.stats-table td {
  border: 1px solid var(--line);
  padding: 8px 12px;
  font-size: 0.88rem;
  color: #2c2722;
}
.stats-table tr:hover td {
  background: #fffefb;
}
.badge-code {
  display: inline-block;
  border: 1px solid var(--accent);
  color: var(--accent);
  font-weight: bold;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 0.8rem;
}
.status-online {
  display: inline-block;
  background: var(--green-bg);
  border: 1px solid var(--green-border);
  color: var(--green);
  font-size: 0.72rem;
  font-weight: bold;
  padding: 2px 8px;
  border-radius: 3px;
  letter-spacing: .03em;
}
.status-offline {
  display: inline-block;
  background: var(--red-bg);
  border: 1px solid var(--red-border);
  color: var(--red);
  font-size: 0.72rem;
  font-weight: bold;
  padding: 2px 8px;
  border-radius: 3px;
  letter-spacing: .03em;
}
.row-total {
  background: #ece4d2 !important;
  font-weight: bold;
  border-top: 2px solid var(--line-dark);
}
.footer-note {
  text-align: center;
  font-size: 0.82rem;
  color: #6a6052;
  font-style: italic;
  margin-top: 16px;
  padding: 8px;
}
</style>
</head>
<body>
<header>
  <h1>Kho ảnh bách khoa</h1>
  <p>Encyclopedia of generated images — Hệ thống sinh ảnh AI phân tán chạy liên tục (Nhóm 6 · Phong cách Neon)</p>
</header>

<form id="f">
  <input id="q" placeholder="Tìm theo tên tiếng Anh, ví dụ: red hat, purple lion..." autocomplete="off">
  <button>Tìm</button>
  <button type="button" id="back" class="ghost" hidden>Về trang chủ</button>
</form>

<main>
  <div id="msg" hidden></div>
  <h2 id="title">50 ảnh mới nhất</h2>
  <div class="grid" id="grid"></div>
</main>

<footer>
  <h2>Thống kê chi tiết kho ảnh theo từng AI</h2>
  <div id="stats-ai">Đang tải số liệu…</div>

  <h2 style="margin-top:30px">Thống kê theo thành viên nhóm</h2>
  <div id="stats-member">Đang tải số liệu…</div>

  <div class="footer-note" id="footer-note">Đang cập nhật tổng quan…</div>
</footer>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let searching = false, token = 0;

function card(i, isNew) {
  const title = esc(i.title || i.name);
  const aiCode = esc(i.ai_id);
  const time = esc(i.created_fmt || '');
  return `
    <figure class="card ${isNew ? 'new' : ''}">
      <div class="plate-frame">
        <div class="plate-mat">
          <img loading="lazy" src="${esc(i.url)}" alt="${title}" width="256" height="256">
        </div>
        <div class="plate-caption">${title} — Pl. ${aiCode}</div>
      </div>
      <figcaption class="card-meta">
        <div class="file-name">${esc(i.filename)}</div>
        <div class="tags-row">
          <span class="badge-ai">AI ${aiCode}</span>
          <span>·</span>
          <span>${time}</span>
        </div>
      </figcaption>
    </figure>
  `;
}

function show(list, title, isNew) {
  $('#title').textContent = title;
  $('#grid').innerHTML = list.map(i => card(i, isNew)).join('');
}

function msg(html) {
  const m = $('#msg');
  m.hidden = !html;
  m.innerHTML = html || '';
}

async function latest() {
  if (searching) return;
  try {
    const r = await (await fetch('/api/latest?limit=50')).json();
    if (!searching) show(r.images, '50 ảnh mới nhất');
  } catch(e) {}
}

async function stats() {
  try {
    const s = await (await fetch('/api/stats')).json();
    
    // Bảng 1: Chi tiết theo từng AI
    const rowsAi = s.by_ai.map(a => `
      <tr>
        <td style="text-align:center"><span class="badge-code">${esc(a.ai_code)}</span></td>
        <td><b>${esc(a.member_name)}</b></td>
        <td>${esc(a.model)}</td>
        <td><b>${a.count}</b></td>
        <td>${a.count_60m}</td>
        <td>${esc(a.last_image)}</td>
        <td style="text-align:center">
          ${a.status === 'ONLINE' ? '<span class="status-online">● ONLINE</span>' : '<span class="status-offline">● OFFLINE</span>'}
        </td>
      </tr>
    `).join('');

    const totalRow = `
      <tr class="row-total">
        <td style="text-align:center">TỔNG CỘNG</td>
        <td>—</td>
        <td>—</td>
        <td>${s.summary.total_images}</td>
        <td>${s.summary.total_60m}</td>
        <td colspan="2" style="letter-spacing:.04em">JOB: ${s.summary.running_jobs} ĐANG CHẠY · ${s.summary.done_jobs} XONG</td>
      </tr>
    `;

    $('#stats-ai').innerHTML = `
      <table class="stats-table">
        <thead>
          <tr>
            <th style="width:90px;text-align:center">AI CODE</th>
            <th>THÀNH VIÊN</th>
            <th>MODEL</th>
            <th>SỐ ẢNH</th>
            <th>60 PHÚT</th>
            <th>ẢNH GẦN NHẤT</th>
            <th style="text-align:center">TRẠNG THÁI</th>
          </tr>
        </thead>
        <tbody>
          ${rowsAi || '<tr><td colspan="7" style="text-align:center">Chưa có tiến trình AI nào kết nối</td></tr>'}
          ${totalRow}
        </tbody>
      </table>
    `;

    // Bảng 2: Thống kê theo Thành viên (Không cần node)
    const rowsMember = s.by_member.map(m => `
      <tr>
        <td><b>${esc(m.member_name)}</b></td>
        <td>${esc(m.slot_ai)}</td>
        <td><b>${m.count}</b></td>
        <td>${m.count_60m}</td>
        <td>${esc(m.last_image)}</td>
      </tr>
    `).join('');

    $('#stats-member').innerHTML = `
      <table class="stats-table">
        <thead>
          <tr>
            <th>THÀNH VIÊN</th>
            <th>SLOT AI</th>
            <th>SỐ ẢNH</th>
            <th>60 PHÚT</th>
            <th>ẢNH GẦN NHẤT</th>
          </tr>
        </thead>
        <tbody>
          ${rowsMember || '<tr><td colspan="5" style="text-align:center">Chưa có dữ liệu</td></tr>'}
        </tbody>
      </table>
    `;

    // Dòng ghi chú chân trang
    $('#footer-note').innerHTML = `
      Kho mở từ <b>${s.summary.opened_time}</b> · ảnh cuối <b>${s.summary.last_image_ago}</b> · <b>${s.summary.total_24h}</b> ảnh trong 24 giờ qua · <b>${s.summary.total_jobs}</b> job đã cấp.
    `;
  } catch(e) {}
}

async function search(q) {
  const my = ++token;
  searching = true;
  $('#back').hidden = false;
  const r = await (await fetch('/api/search?q=' + encodeURIComponent(q))).json();
  if (my !== token) return;
  if (r.status === 'found') {
    msg('');
    show(r.images, `Kết quả cho “${r.query}” (${r.images.length} ảnh)`);
    return;
  }
  const t0 = Date.now();
  $('#grid').innerHTML = '';
  $('#title').textContent = `Đang vẽ “${r.query}”`;
  while (my === token) {
    msg(`<span class="spin"></span>Kho chưa có ảnh này — AI đang vẽ mới cho bạn… ${Math.round((Date.now() - t0) / 1000)}s`);
    await new Promise(x => setTimeout(x, 1500));
    try {
      const j = await (await fetch('/api/job/' + r.job_id)).json();
      if (j.status === 'done') {
        msg('');
        show([j.image], `Ảnh AI vừa vẽ cho “${r.query}”`, true);
        stats();
        return;
      }
    } catch(e) {}
  }
}

$('#f').onsubmit = e => {
  e.preventDefault();
  const q = $('#q').value.trim();
  if (q) search(q);
};

$('#back').onclick = () => {
  token++;
  searching = false;
  msg('');
  $('#back').hidden = true;
  $('#q').value = '';
  latest();
};

latest();
stats();
setInterval(latest, 20000);
setInterval(stats, 15000);
</script>
</body>
</html>
